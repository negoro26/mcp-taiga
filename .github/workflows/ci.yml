name: CI

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:

jobs:
  test:
    name: Verify Build and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint source code
        run: npm run lint

      - name: Run test suite
        run: npm test
